[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "demucs-infer"
dynamic = ["version"]
description = "Music source separation in the waveform domain - Inference-only (PyTorch 2.x)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
# Note: license-files automatically includes LICENSE by default
authors = [
    {name = "Alexandre Défossez", email = "defossez@fb.com"},
]
maintainers = [
    {name = "worzpro Development Team"},
]
keywords = ["audio", "music", "source-separation", "demucs", "inference"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Minimal inference-only dependencies
# soundfile owns file I/O whenever the FFmpeg executable is unavailable.
# TorchAudio and TorchCodec are not needed for this package's inference path.
dependencies = [
    "torch>=2.0.0",
    "soundfile>=0.12.1",
    "einops",
    "julius>=0.2.3",
    "numpy",
    "pyyaml",
    "tqdm",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
# Optional: MP3 encoding support
mp3 = [
    "lameenc>=1.2",
]
# Optional: Quantized model support
quantized = [
    "diffq>=0.2.1",
]
# Optional: Community model downloads (Google Drive)
community = [
    "gdown>=5.0.0",
]
# Optional: native HTDemucs checkpoints without pickle deserialization
safetensors = [
    "safetensors>=0.4.2",
]
# Development dependencies
dev = [
    "black",
    "ruff",
    "safetensors>=0.4.2",
]

[project.scripts]
demucs-infer = "demucs_infer.separate:main"

[project.urls]
Homepage = "https://github.com/openmirlab/demucs-infer"
Repository = "https://github.com/openmirlab/demucs-infer"
"Original Demucs" = "https://github.com/facebookresearch/demucs"
"Bug Reports" = "https://github.com/openmirlab/demucs-infer/issues"
Changelog = "https://github.com/openmirlab/demucs-infer/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "demucs_infer/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["demucs_infer"]

[tool.hatch.build.targets.sdist]
packages = ["demucs_infer"]

[dependency-groups]
dev = [
    "pytest>=8.3.5,<8.4; python_version < '3.9'",
    "pytest>=8.3.5; python_version >= '3.9'",
    "safetensors>=0.4.2",
]

[tool.pytest.ini_options]
markers = [
    "network: hits real network endpoints (checkpoint URL liveness); deselected by default, run with `pytest -m network`",
    "realweights: needs a real downloaded checkpoint; deselected by default, run with `pytest -m realweights`",
]
addopts = "-m \"not network and not realweights\""

[tool.hatch.build]
include = [
    "demucs_infer/**/*.py",
    "demucs_infer/**/*.yaml",  # Include YAML config files (remote/*.yaml)
    "demucs_infer/**/*.yml",   # Include YAML config files
    "demucs_infer/**/*.txt",   # Include files.txt in remote/
    "demucs_infer/**/*.toml",  # Include package-owned checkpoint metadata
]
