name: Release verification

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Test-gate (constitution art.7 amendment, ADOPT campaign P5): nothing
    # passing across every Python version this package advertises.
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and offline test tools
        run: |
          python -m pip install --upgrade pip
          if python -c "import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 8) else 1)"; then
            python -m pip install "pytest>=8.3.5,<8.4"
          else
            python -m pip install "pytest>=8.3.5"
          fi
          python -m pip install -e ".[safetensors]"

      - name: Run complete offline suite
        run: python -m pytest tests/

      - name: Build wheel from sdist
        run: |
          python -m pip install build
          python -m build --sdist
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wheelhouse" dist/*.tar.gz

      - name: Install wheel outside checkout and smoke package resources
        run: |
          python -m venv "$RUNNER_TEMP/install-smoke"
          "$RUNNER_TEMP/install-smoke/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/install-smoke/bin/python" -m pip install "$RUNNER_TEMP"/wheelhouse/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/install-smoke/bin/python" - <<'PY'
          import demucs_infer
          from demucs_infer import (
              DemucsSession,
              checkpoint_config_path,
              validate_checkpoint_config,
          )
          from demucs_infer.pretrained import REMOTE_ROOT

          assert demucs_infer.__version__
          assert callable(DemucsSession)
          assert checkpoint_config_path().exists()
          assert (REMOTE_ROOT / "files.txt").is_file()
          config = validate_checkpoint_config()
          assert config["package"]["name"] == "demucs-infer"
          assert config["schema"]["version"] == 2
          PY

  build:
    needs: [test]
    runs-on: ubuntu-latest
    # Note: Environment is optional. If you want to add protection rules later,
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build hatchling
      
      - name: Build package
        run: python -m build
      
      - name: Validate package
        run: |
          # Basic validation - check that dist/ contains expected files
          if [ ! -f dist/*.whl ] || [ ! -f dist/*.tar.gz ]; then
            echo "❌ Package build failed: missing wheel or source distribution"
            exit 1
          fi
          echo "✅ Package built successfully"
